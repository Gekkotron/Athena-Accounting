coverage:
  status:
    project:
      default:
        # Target moves with the codebase, but tolerate a 1-point drop so a
        # single flaky reference (e.g. one job's upload skipped after a test
        # failure) doesn't post a red status on the next healthy commit.
        target: auto
        threshold: 1%
      backend:
        flags: [backend]
        target: auto
        threshold: 1%
      frontend:
        flags: [frontend]
        target: auto
        threshold: 1%
      # Hard absolute floors — catch slow drift even if the sliding
      # auto-target has drifted down over many small drops. If current
      # coverage falls below the floor, CI fails regardless of baseline.
      backend-floor:
        flags: [backend]
        target: 40%
        threshold: 0%
      frontend-floor:
        flags: [frontend]
        target: 40%
        threshold: 0%
    patch:
      default:
        target: 80%
        threshold: 2%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/
    carryforward: true
