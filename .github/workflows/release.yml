name: Release

# Publish a GitHub Release from a version tag.
#
# Trigger with:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag body comes from CHANGELOG.md — the section headed
# "## [0.2.0] - YYYY-MM-DD" is extracted and used as the release notes,
# so the same source of truth ships in-repo and on the Releases page.
#
# Build verification runs first (same steps as CI) so a bad tag can't
# publish a release. `permissions: contents: write` is what lets
# softprops/action-gh-release open the release; nothing else needs it.

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-desktop*'

permissions:
  contents: write
  # Lets the docker-images job push to ghcr.io with the workflow's
  # GITHUB_TOKEN — no PAT involved.
  packages: write

jobs:
  verify-build:
    name: Verify build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-images:
    name: Docker image — ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: verify-build

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: athena-accounting-backend
            context: ./backend
            dockerfile: backend/Dockerfile
          - image: athena-accounting-frontend
            # Repo-root context, same reason as docker-compose.yml:
            # frontend/tsconfig.json includes ../shared/**/*.ts, which is
            # invisible with context=./frontend.
            context: .
            dockerfile: frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # arm64 layers build under QEMU emulation — slow (the frontend
      # tsc + vite build especially) but this only runs on release tags.
      # The backend's native deps (@node-rs/argon2, @napi-rs/canvas) ship
      # linux-arm64 prebuilds, so npm install doesn't compile from source.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # The owner segment is lowercased automatically →
          # ghcr.io/gekkotron/<image>.
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # v1.2.3 → tag "1.2.3", plus "latest" via the default flavor —
          # which skips `latest` for prerelease versions (1.2.3-rc.1) on
          # its own.
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Gated on the images: a release page must never advertise pull
    # commands for images that failed to publish.
    needs: [verify-build, docker-images]

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        # ${GITHUB_REF#refs/tags/v} → "0.2.0" from "refs/tags/v0.2.0"
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        # Slice the section headed "## [X.Y.Z] ..." up to the next "## " line
        # and save it to a file (multi-line outputs need heredoc syntax).
        # Fail hard if the section is missing — releasing without notes is
        # almost never what we want, and silent empty releases are worse.
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v ver="${version}" '
            $0 ~ "^## \\[" ver "\\]" { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${version}. Expected a header like '## [${version}] - YYYY-MM-DD'."
            exit 1
          fi

          echo "---- release notes ----"
          cat release-notes.md
          echo "-----------------------"

      - name: Append Docker image pointers to the release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo ""
            echo "## Docker images"
            echo ""
            echo "Prebuilt multi-arch images (amd64 + arm64) for this release:"
            echo ""
            echo '```sh'
            echo "docker pull ghcr.io/gekkotron/athena-accounting-backend:${version}"
            echo "docker pull ghcr.io/gekkotron/athena-accounting-frontend:${version}"
            echo '```'
            echo ""
            echo "Run them with [\`docker-compose.release.yml\`](https://github.com/Gekkotron/Athena-Accounting/blob/v${version}/docker-compose.release.yml) — no local build needed. See the README quickstart."
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          # Pre-release when the version has a hyphen (v1.0.0-rc.1, etc.).
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
